name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Python examples compile
        run: python -m compileall -q .

      - name: API calls are in the contract
        run: python scripts/check_contract_routes.py

      - name: Shell scripts parse
        run: find . -name '*.sh' -not -path './node_modules/*' -print0 | xargs -0 -n1 bash -n

      - name: TypeScript examples type-check
        run: |
          npm ci
          npx tsc --noEmit

      - name: Terraform is formatted
        run: terraform fmt -check -recursive terraform
