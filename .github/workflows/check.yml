name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Python examples compile
        run: python -m compileall -q .

      - name: Shell scripts parse
        run: find . -name '*.sh' -not -path './node_modules/*' -print0 | xargs -0 -n1 bash -n

      # ibee-sdk 0.5.0 is not on npm yet: build it from its branch. Once it is
      # published, replace this with `npm install`.
      - name: TypeScript examples type-check
        run: |
          git clone --depth 1 -b feat/0.5.0 https://github.com/devs-ibee/ibee-typescript.git "$RUNNER_TEMP/ibee-typescript"
          (cd "$RUNNER_TEMP/ibee-typescript" && npm ci && npm run build && npm pack --pack-destination "$RUNNER_TEMP")
          npm install --no-save "$RUNNER_TEMP"/ibee-sdk-0.5.0.tgz
          npx tsc --noEmit

      - name: Terraform is formatted
        run: terraform fmt -check -recursive terraform
