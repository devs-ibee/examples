name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Python examples compile
        run: python -m compileall -q .

      - name: API calls are in the contract
        run: python scripts/check_contract_routes.py

      - name: Shell scripts parse
        run: find . -name '*.sh' -not -path './node_modules/*' -print0 | xargs -0 -n1 bash -n

      # A branch that needs an unreleased ibee-sdk is checked against the ibee-typescript
      # branch of the same name when there is one (as the CLI's CI does with ibee-python).
      - name: TypeScript examples type-check
        env:
          SDK_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          npm ci
          if [ "$SDK_REF" != main ] && git ls-remote --exit-code --heads https://github.com/devs-ibee/ibee-typescript.git "$SDK_REF" > /dev/null; then
            git clone --quiet --depth 1 --branch "$SDK_REF" https://github.com/devs-ibee/ibee-typescript.git "$RUNNER_TEMP/ibee-typescript"
            (cd "$RUNNER_TEMP/ibee-typescript" && npm ci && npm run build)
            npm install --no-save "$RUNNER_TEMP/ibee-typescript"
          fi
          npx tsc --noEmit

      - name: Terraform is formatted
        run: terraform fmt -check -recursive terraform
