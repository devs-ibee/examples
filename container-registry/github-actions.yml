# Build and push to the IBEE Container Registry on every commit to main.
# Save as .github/workflows/publish.yml and add these repository secrets:
#   IBEE_REGISTRY_NAME      registry name, for example acme-apps
#   IBEE_REGISTRY_USERNAME  registry username of a "Pull and push" access token
#   IBEE_REGISTRY_TOKEN     that access token
name: Publish image

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.ibee.ai
          username: ${{ secrets.IBEE_REGISTRY_USERNAME }}
          password: ${{ secrets.IBEE_REGISTRY_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            registry.ibee.ai/${{ secrets.IBEE_REGISTRY_NAME }}/web:${{ github.sha }}
            registry.ibee.ai/${{ secrets.IBEE_REGISTRY_NAME }}/web:latest
