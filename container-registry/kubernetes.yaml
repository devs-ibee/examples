# Run an image from a private IBEE registry.
# Create the pull secret first, from a "Pull only" access token:
#   kubectl create secret docker-registry ibee-registry \
#     --docker-server=registry.ibee.ai \
#     --docker-username='<registry-username>' \
#     --docker-password='<access-token>'
# Replace acme-apps with your registry name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: ibee-registry
      containers:
        - name: web
          image: registry.ibee.ai/acme-apps/web:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
